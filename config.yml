---
# Additional NGINX configuration files
# This section allows you to specify extra Nginx configuration files that will be copied into the container.
# Each file should have a name ending in '.conf', as Nginx will only load files with this extension.
nginx_docker_config:
  - name: jellyfin.conf
    content: |-
      server {
          listen 443 ssl;
          listen [::]:443 ssl;
          http2 on;

          server_name _;

          ## The default `client_max_body_size` is 1M, this might not be enough for some posters, etc.
          client_max_body_size 20M;

          # Comment next line to allow TLSv1.0 and TLSv1.1 if you have very old clients
          ssl_protocols TLSv1.3 TLSv1.2;

          ssl_certificate /etc/nginx/ssl/tls.crt;
          ssl_certificate_key /etc/nginx/ssl/tls.key;

          # use a variable to store the upstream proxy
          set $jellyfin 127.0.0.1;

          # Security / XSS Mitigation Headers
          add_header X-Content-Type-Options "nosniff";

          # Permissions policy. May cause issues with some clients
          add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), battery=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), document-domain=(), encrypted-media=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), keyboard-map=(), local-fonts=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;

          # Content Security Policy
          # See: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
          # Enforces https content and restricts JS/CSS to origin
          # External Javascript (such as cast_sender.js for Chromecast) must be whitelisted.
          add_header Content-Security-Policy "default-src https: data: blob: ; img-src 'self' https://* ; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.youtube.com blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; font-src 'self'";

          location / {
              # Proxy main Jellyfin traffic
              proxy_pass http://$jellyfin:8096;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Forwarded-Protocol $scheme;
              proxy_set_header X-Forwarded-Host $http_host;

              # Disable buffering when the nginx proxy gets very resource heavy upon streaming
              proxy_buffering off;
          }

          location /socket {
              # Proxy Jellyfin Websockets traffic
              proxy_pass http://$jellyfin:8096;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Forwarded-Protocol $scheme;
              proxy_set_header X-Forwarded-Host $http_host;
          }
      }
