---
all:
  hosts:
    jellyfin.local:
      ansible_become: true

  vars:
    # Jellyfin Docker image to use
    # Set to the latest available version for up-to-date features
    jellyfin_docker_image: jellyfin/jellyfin:latest

    # TLS Certificates for NGINX
    # These will be placed inside the container under /etc/nginx/ssl.
    nginx_docker_certs: []
      # TLS certificate loaded from the inventory directory
      # Required for enabling HTTPS on the Nginx container
      # - name: tls.crt
      #   content: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/tls.crt') }}"

      # TLS certificate loaded from the inventory directory
      # Required for enabling HTTPS on the Nginx container
      # - name: tls.key
      #   content: "{{ lookup('ansible.builtin.file', inventory_dir ~ '/tls.key') }}"
